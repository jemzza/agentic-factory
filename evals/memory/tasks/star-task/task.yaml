id: star-task
title: Star tasks
request: |
  Tasks can be starred. Add a starred flag and endpoints to star and unstar. Add tests.
acceptance_criteria:
  - Every task has a boolean field starred, false by default, present in all API responses
  - POST /tasks/:id/star sets starred to true and POST /tasks/:id/unstar sets it to false; both return 200 with the task
  - A deleted task returns 409 CONFLICT, an unknown task 404 NOT_FOUND
scope:
  allowed_paths: ["src/**", "tests/**"]
budget: { max_gate_fix_cycles: 2, max_review_cycles: 1, max_cost_usd: 1.0, timeout_minutes: 15 }
