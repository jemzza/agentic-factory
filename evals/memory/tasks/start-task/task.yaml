id: start-task
title: Start a task
request: |
  Add a way to start working on a task. Add tests for the success path and the errors.
acceptance_criteria:
  - POST /tasks/:id/start sets the status to in_progress, bumps updatedAt and returns 200 with the task
  - A deleted task returns 409 CONFLICT
  - An unknown task returns 404 NOT_FOUND
scope:
  allowed_paths: ["src/**", "tests/**"]
budget: { max_gate_fix_cycles: 2, max_review_cycles: 1, max_cost_usd: 1.0, timeout_minutes: 15 }
