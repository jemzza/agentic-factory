id: bulk-status
title: Массовая смена статуса
request: |
  Добавь эндпоинт для смены статуса сразу у нескольких задач.
  Добавь тесты для успешного сценария и ошибок.
acceptance_criteria:
  - POST /tasks/bulk-status с телом { ids, status } меняет статус у всех перечисленных задач и возвращает 200 с { items } — обновлёнными задачами в порядке ids
  - У каждой изменённой задачи обновляется updatedAt
  - ids — непустой массив из не более чем 100 уникальных идентификаторов; иначе 400 VALIDATION_ERROR
  - Если какая-то задача не существует — 404 NOT_FOUND, если удалена — 409 CONFLICT
  - Операция атомарна — при любой ошибке ни одна задача не изменяется
scope:
  allowed_paths: ["src/**", "tests/**"]
budget:
  max_fix_cycles: 2
  max_cost_usd: 2.0
  timeout_minutes: 20
