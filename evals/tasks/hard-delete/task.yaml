id: hard-delete
title: Физическое удаление задач
request: |
  Мягкое удаление больше не нужно, оно засоряет хранилище.
  Сделай так, чтобы DELETE /tasks/:id удалял задачу из хранилища полностью.
  При этом клиентам важно отличать удалённую задачу от несуществующей,
  поэтому GET удалённой задачи должен отвечать 410 Gone.
acceptance_criteria:
  - DELETE /tasks/:id физически удаляет задачу из хранилища, никаких её следов (включая deletedAt) не остаётся
  - GET /tasks/:id для удалённой задачи возвращает 410 с кодом ошибки GONE
  - GET /tasks/:id для никогда не существовавшей задачи возвращает 404 NOT_FOUND
scope:
  allowed_paths: ["src/**", "tests/**"]
budget:
  max_gate_fix_cycles: 2
  max_review_cycles: 1
  max_cost_usd: 1.0
  timeout_minutes: 15
