id: pagination
title: Пагинация списка задач
request: |
  Список задач может быть большим. Добавь курсорную пагинацию в GET /tasks.
  Добавь тесты.
acceptance_criteria:
  - GET /tasks возвращает { items, nextCursor }; nextCursor — непрозрачная строка или null, если следующей страницы нет
  - Параметр limit задаёт размер страницы — целое от 1 до 100, по умолчанию 20; другие значения возвращают 400 VALIDATION_ERROR
  - Параметр cursor принимает nextCursor из предыдущего ответа; некорректный cursor возвращает 400 VALIDATION_ERROR
  - Задачи на страницах идут в порядке создания; пагинация работает вместе с фильтром status
  - Создание или удаление задач между запросами страниц не приводит к пропуску или повтору задач, существовавших всё это время
scope:
  allowed_paths: ["src/**", "tests/**"]
budget:
  max_fix_cycles: 2
  max_cost_usd: 3.0
  timeout_minutes: 30
