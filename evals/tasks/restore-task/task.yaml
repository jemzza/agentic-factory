id: restore-task
title: Восстановление удалённой задачи
request: |
  Добавь возможность восстановить мягко удалённую задачу.
  Добавь тесты для успешного сценария и ошибок.
acceptance_criteria:
  - POST /tasks/:id/restore снимает удаление (deletedAt становится null), обновляет updatedAt и возвращает 200 с задачей
  - Восстановленная задача снова доступна через GET /tasks/:id и в списке GET /tasks
  - Для задачи, которая не удалена, возвращается 409 CONFLICT
  - Для несуществующей задачи возвращается 404 NOT_FOUND
  - Все существующие правила для активных задач продолжают соблюдаться
scope:
  allowed_paths: ["src/**", "tests/**"]
budget:
  max_gate_fix_cycles: 2
  max_review_cycles: 1
  max_cost_usd: 2.0
  timeout_minutes: 20
