id: search-tasks
title: Поиск задач по названию
request: |
  Добавь в список задач поиск по названию через query-параметр q.
  Добавь тесты.
acceptance_criteria:
  - GET /tasks?q=<строка> возвращает только задачи, в названии которых есть эта подстрока, без учёта регистра
  - Значение q обрезается по краям; пустое после обрезки значение возвращает 400 VALIDATION_ERROR
  - q длиннее 100 символов возвращает 400 VALIDATION_ERROR
  - Поиск комбинируется с фильтром status
  - Удалённые задачи в результаты поиска не попадают
scope:
  allowed_paths: ["src/**", "tests/**"]
budget:
  max_gate_fix_cycles: 2
  max_review_cycles: 1
  max_cost_usd: 1.0
  timeout_minutes: 15
