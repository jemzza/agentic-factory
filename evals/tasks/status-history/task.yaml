id: status-history
title: История изменений статуса
request: |
  Нужно видеть, как менялся статус задачи. Сохраняй историю изменений статуса
  и добавь эндпоинт для её получения. Добавь тесты.
acceptance_criteria:
  - GET /tasks/:id/history возвращает 200 и { items } — записи { from, to, at } в хронологическом порядке
  - Создание задачи записывает { from null, to — начальный статус, at — createdAt }
  - Каждое изменение статуса через PATCH добавляет запись с at, равным новому updatedAt; PATCH без изменения статуса (в том числе с тем же статусом) запись не добавляет
  - Для удалённой или несуществующей задачи возвращается 404 NOT_FOUND
  - Формат задачи в остальных эндпоинтах не меняется
scope:
  allowed_paths: ["src/**", "tests/**"]
budget:
  max_fix_cycles: 2
  max_cost_usd: 3.0
  timeout_minutes: 30
