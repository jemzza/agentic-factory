# Projects served by this factory. Each project keeps its own rules in .factory/config.yaml
# in its repository (read from the target branch as committed, never from an agent's
# worktree). `source` is where the factory gets the repository; the eval stand
# (evals/eval.config.yaml) has its own source and never uses a remote.
version: 1
projects:
  - id: taskflow
    source: { kind: fixture, path: fixtures/taskflow }
  # On GitHub (owner jemzza, private). taskflow-demo is the stand at factory-baseline (8e6e21f);
  # ledgerlite is the second stack (Python 3.12), pushed from the local repository (8500e89).
  # Only allowed_users can give tasks and commands. The token (FACTORY_GITHUB_TOKEN) is a
  # fine-grained PAT for these two repositories only.
  - id: taskflow-demo
    source: { kind: git, url: https://github.com/jemzza/taskflow-demo.git, ref: main }
    github: { repo: jemzza/taskflow-demo }
    allowed_users: [jemzza]
  - id: ledgerlite
    source: { kind: git, url: https://github.com/jemzza/ledgerlite.git, ref: main }
    github: { repo: jemzza/ledgerlite }
    allowed_users: [jemzza]
